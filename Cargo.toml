[package]
name = "mojito"
version = "0.3.0"
edition = "2024"
rust-version = "1.96.1"
description = "A compact compiler and register VM for a CPU-focused subset of Mojo"
license = "MIT"
repository = "https://github.com/bpr/mojito"
readme = "README.md"
keywords = ["mojo", "compiler", "interpreter", "language", "vm"]
categories = ["command-line-utilities", "compilers", "development-tools"]
include = [
    "/src/**",
    "/crates/**",
    "/stdlib/**",
    "/tests/**",
    "/assets/**",
    "/conformance/**",
    "/scripts/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/rustfmt.toml",
    "/.gitignore",
    "/CLAUDE.md",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/grammar.md",
    "/roadmap.md",
]

[workspace]
# The root facade package plus one crate per compiler phase and the
# independently versioned native runtime (see AGENTS.md "Workspace Layout").
# Only `crates/mojito-pliron` — reached via the optional `backend-pliron`
# feature — may require LLVM.
members = ["crates/*"]

[workspace.lints.clippy]
# Enable entire lint groups. `nursery` stays at `warn`: its lints are
# explicitly unstable and false-positive-prone, so they inform without
# breaking the build.
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Configure individual rules.
todo = "deny"
cognitive_complexity = "warn"
missing_errors_doc = "allow"

# Mojo source fragments in tests and diagnostics contain `{...}` placeholders.
literal_string_with_formatting_args = "allow"

# Index, span, register, and lane arithmetic converts between `usize` and the
# fixed widths the MIR/native ABI pins. The ranges are structural invariants,
# not values a cast lint can see.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# `ty`/`tys`, `read`/`reg`, `body`/`block` pairs are the vocabulary of a
# compiler; renaming them for the lint would make the code read worse.
similar_names = "allow"

# The crates expose hundreds of small accessors; `#[must_use]` on each is
# noise rather than signal.
must_use_candidate = "allow"

# Arms in the checker/MIR dispatch matches coincide incidentally, not
# semantically. Merging them writes a claim that two independently maintained
# cases are one case, which the next divergence has to undo.
match_same_arms = "allow"

# The lowering and checking methods take `&mut self`, so the suggested
# `map_or_else` closures cannot both borrow the receiver (E0499/E0524). Where
# it does compile, the `if let` still reads in source order.
option_if_let_else = "allow"

# The lexer's character-dispatch arms end in a uniform `continue`; that
# terminator is what distinguishes them from the arms that fall through to the
# shared tail below the match.
needless_continue = "allow"

[workspace.package]
edition = "2024"
rust-version = "1.96.1"

[workspace.dependencies]
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
petgraph = "0.8.3"

[features]
# Pliron native backend, Mojito's supported path to LLVM and optimized native
# binaries. Requires LLVM 23.1 (llvm-sys 231; discovery via
# LLVM_SYS_231_PREFIX).
# The default build must stay free of LLVM: tests/backend_isolation_test.rs
# guards the default dependency graph. See docs/notes/pliron-stage0.md.
backend-pliron = [
    "dep:mojito-pliron",
    "dep:llvm-sys",
    "dep:pliron",
    "dep:object",
    "dep:sha2",
]

[dependencies]
# Direct llvm-sys (same 231/LLVM-23.1 pin pliron-llvm resolves) powers the
# target-data layout cross checks in tests/pliron_backend_test.rs.
llvm-sys = { version = "231", optional = true }
mojito-analysis = { path = "crates/mojito-analysis" }
mojito-ast = { path = "crates/mojito-ast" }
mojito-checked = { path = "crates/mojito-checked" }
mojito-checker = { path = "crates/mojito-checker" }
mojito-common = { path = "crates/mojito-common" }
mojito-comptime = { path = "crates/mojito-comptime" }
mojito-hir = { path = "crates/mojito-hir" }
mojito-lexer = { path = "crates/mojito-lexer" }
mojito-mir = { path = "crates/mojito-mir" }
mojito-module = { path = "crates/mojito-module" }
mojito-native = { path = "crates/mojito-native" }
mojito-native-core = { path = "crates/mojito-native-core" }
mojito-pliron = { path = "crates/mojito-pliron", optional = true }
mojito-parser = { path = "crates/mojito-parser" }
mojito-symbol = { path = "crates/mojito-symbol" }
mojito-types = { path = "crates/mojito-types" }
mojito-vm = { path = "crates/mojito-vm" }
# Direct pliron (the same upstream revision crates/mojito-pliron resolves) powers
# the canonical-text parse -> print fixpoint check in
# tests/pliron_backend_test.rs.
pliron = { git = "https://github.com/pliron-org/pliron", rev = "477e6b0edb18b29df4cf7b90f0f468dc8a872f22", optional = true }
# Pure-Rust ELF/archive inspection and digests for the resolved-toolchain
# report, runtime ABI validation, and reproducibility diagnostics. Read-only,
# no compression backends.
object = { version = "0.40.0", optional = true, default-features = false, features = [
    "read",
    "std",
] }
sha2 = { version = "0.11.0", optional = true }

[dev-dependencies]
expect-test = "1.5.1"
libtest-mimic = "0.8.2"
mojito-runtime = { path = "crates/mojito-runtime" }
tempfile = "3.20.0"

[lints]
workspace = true

[[test]]
name = "corpus_test"
harness = false

[[test]]
name = "artifact_conformance_test"
harness = false

[[test]]
name = "pliron_backend_test"
required-features = ["backend-pliron"]

[[test]]
name = "pliron_toolchain_test"
required-features = ["backend-pliron"]

[[test]]
name = "pliron_opt_regression_test"
required-features = ["backend-pliron"]

[[test]]
name = "pliron_debug_test"
required-features = ["backend-pliron"]

[[test]]
name = "pliron_repro_test"
required-features = ["backend-pliron"]

[[test]]
name = "pliron_dist_test"
required-features = ["backend-pliron"]

# Release code with full debug info for sampling profilers (samply/perf):
# `cargo build --profile profiling` -> target/profiling/mojito.
[profile.profiling]
inherits = "release"
debug = true
