[package]
name = "mojito"
version = "0.3.0"
edition = "2024"
rust-version = "1.96.1"
description = "A compact compiler and register VM for a CPU-focused subset of Mojo"
license = "MIT"
repository = "https://github.com/bpr/mojito"
readme = "README.md"
keywords = ["mojo", "compiler", "interpreter", "language", "vm"]
categories = ["command-line-utilities", "compilers", "development-tools"]
include = [
    "/src/**",
    "/stdlib/**",
    "/tests/**",
    "/assets/**",
    "/conformance/**",
    "/scripts/**",
    "/docs/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust-toolchain.toml",
    "/rustfmt.toml",
    "/.gitignore",
    "/CLAUDE.md",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/grammar.md",
    "/roadmap.md",
]

[features]
# Experimental Pliron native backend (roadmap section 4, Stage 1). Requires
# LLVM 22 dev libraries (llvm-sys 221; discovery via LLVM_SYS_221_PREFIX).
# The default build must stay free of LLVM: tests/backend_isolation_test.rs
# guards the default dependency graph. See docs/notes/pliron-stage0.md.
backend-pliron = ["dep:pliron", "dep:pliron-llvm"]

[dependencies]
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
petgraph = "0.8.3"
pliron = { version = "=0.17.0", optional = true }
pliron-llvm = { version = "=0.17.0", optional = true }

[dev-dependencies]
expect-test = "1.5.1"
libtest-mimic = "0.8.2"
tempfile = "3.20.0"

[[test]]
name = "corpus_test"
harness = false

[[test]]
name = "artifact_conformance_test"
harness = false

[[test]]
name = "pliron_backend_test"
required-features = ["backend-pliron"]
