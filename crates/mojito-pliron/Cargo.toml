[package]
name = "mojito-pliron"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
llvm-sys = { version = "221" }
mojito-analysis = { path = "../mojito-analysis" }
mojito-ast = { path = "../mojito-ast" }
mojito-checked = { path = "../mojito-checked" }
mojito-common = { path = "../mojito-common" }
mojito-mir = { path = "../mojito-mir" }
mojito-native = { path = "../mojito-native" }
mojito-native-core = { path = "../mojito-native-core" }
mojito-symbol = { path = "../mojito-symbol" }
mojito-types = { path = "../mojito-types" }
mojito-vm = { path = "../mojito-vm" }
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
pliron = { version = "=0.17.0" }
pliron-llvm = { version = "=0.17.0" }
sha2 = { version = "0.11.0" }

[dev-dependencies]
expect-test = "1.5.1"
tempfile = "3.20.0"
